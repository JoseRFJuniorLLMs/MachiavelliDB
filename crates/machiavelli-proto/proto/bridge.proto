syntax = "proto3";
package heraclitus.v1;
// Wire-compatible subset of the existing Heraclitus contract. Append is NOT
// the proposed privileged AdminIntent API and does not return a Merkle receipt.
service Heraclitus {
  rpc Append(AppendRequest) returns (AppendResponse);
  rpc Admin(AdminRequest) returns (AdminResponse);
}
message AppendRequest {
  string agent_id = 1; string session_id = 2; string kind = 3; bytes content = 4;
  repeated float hyp = 5; repeated float sph = 6; repeated float euc = 7;
  map<string,string> attrs = 8; repeated string parents = 9; string idempotency_key = 10;
}
message AppendResponse { uint64 lsn = 1; bool deduplicated = 2; string event_id = 3; }
message AdminRequest { string op = 1; string arg = 2; }
message AdminResponse { bool ok = 1; string message = 2; }
